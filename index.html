<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>退勤打刻</title>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body { margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #f5f6f6; font-family: sans-serif; color: #333; }
    .spinner { border: 4px solid #e0e0e0; border-top: 4px solid #06c755; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status-text { font-size: 16px; font-weight: bold; text-align: center; line-height: 1.5; padding: 0 20px; }
    #error-message { color: #ff334b; margin-top: 20px; font-size: 14px; text-align: center; padding: 0 20px; word-break: break-all; }

    /* --- カスタム確認モーダル用のスタイル --- */
    #custom-confirm-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 24px 20px;
      width: 85%;
      max-width: 320px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .modal-text {
      color: #ff334b; /* 赤文字 */
      font-weight: bold;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
      text-align: left;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
    }
    .modal-btn {
      flex: 1;
      padding: 12px 0;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #confirm-cancel {
      background-color: #e0e0e0;
      color: #333;
    }
    #confirm-ok {
      background-color: #ff334b;
      color: white;
    }
  </style>
</head>
<body>

  <!-- 最初からぐるぐるを表示させておく -->
  <div class="spinner" id="spinner"></div>
  <div id="status-text">起動中...</div>
  <div id="error-message"></div>

  <div id="register-container" style="display: none; margin-top: 20px; text-align: center;">
    <button id="register-btn" style="padding: 10px 20px; font-size: 16px; background-color: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer;">登録画面へ進む</button>
  </div>

  <!-- カスタム確認モーダル -->
  <div id="custom-confirm-modal">
    <div class="modal-content">
      <div id="modal-message" class="modal-text"></div>
      <div class="modal-buttons">
        <button id="confirm-cancel" class="modal-btn">キャンセル</button>
        <button id="confirm-ok" class="modal-btn">OK</button>
      </div>
    </div>
  </div>

  <script src="index.js?v=2.1.3"></script>
</body>
</html>
